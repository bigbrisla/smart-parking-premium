# Configuration of the "Gran Reno - Coperto" instance.
# The ONLY difference between the two system instances: this file.

parking:
  id: granreno
  name: "Gran Reno - Coperto"
  port: 8001

# GPS coordinates of the parking entrance (used by the Haversine formula).
# Plausible values for Casalecchio di Reno (BO). Feel free to adjust.
entrance:
  lat: 44.47690
  lon: 11.28070

# Distance (in meters) below which the barrier opens automatically.
unlock_threshold_m: 150

# If true, the barrier opens only if there is an active reservation (RESERVED state).
# Realistic scenario: you book from the bot, then approach and the barrier recognizes you.
unlock_requires_reservation: true

# Approach lane: move a car by hand along the central strip of the mockup; the
# webcam tracks it and simulates its GPS (-> Haversine -> barrier).
# road_roi and barrier_edge must be calibrated on your mockup (see auto_calibrate).
approach:
  enabled: true              # lane calibrated automatically (auto_calibrate.py)
  road_roi: [522, 503, 1478, 664]   # central horizontal lane between the two rows
  barrier_edge: left         # the barrier is on the left (ENTRANCE side)
  length_m: 300              # simulated lane length in meters
  min_area_ratio: 0.05       # minimum area in the lane to detect a car (filters noise)

# Digital Twin slots (calibrated on the mockup: P01-P10, two rows of 5).
# ROI [x1, y1, x2, y2] in PIXELS (frame rotated 180). Generated by auto_calibrate.py
slots:
  # top row (P01-P05, left->right)
  - { id: P01, roi: [524, 244, 713, 502] }
  - { id: P02, roi: [716, 245, 905, 502] }
  - { id: P03, roi: [907, 246, 1095, 503] }
  - { id: P04, roi: [1097, 246, 1286, 503] }
  - { id: P05, roi: [1288, 246, 1478, 503] }
  # bottom row (P06-P10, left->right)
  - { id: P06, roi: [522, 664, 713, 922] }
  - { id: P07, roi: [715, 664, 904, 921] }
  - { id: P08, roi: [906, 664, 1094, 922] }
  - { id: P09, roi: [1097, 664, 1285, 922] }
  - { id: P10, roi: [1289, 664, 1477, 923] }

vision:
  source: 0                  # webcam index (0), a video path, or "none" to disable
  method: cv                 # "cv" = occupancy via background subtraction (robust default on toys)
  rotate: 180                # iPhone mounted upside down -> straighten the frame in software
  loop_fps: 8                # detection loop frequency
  # --- cv method parameters ---
  diff_thresh: 30            # pixel difference threshold (0-255): higher = less sensitive
  occ_ratio: 0.35            # fraction of (shadow-free) pixels in the ROI to mark "occupied"
  roi_inset: 6               # px trimmed from ROI edges (ignore the drawn lines)
  # --- yolo method parameters (used only if method: yolo, e.g. after fine-tuning) ---
  model: "yolo11n.pt"
  conf: 0.25
  vehicle_classes: [2, 5, 7] # COCO classes: 2=car, 5=bus, 7=truck

# Federated parkings whose public endpoint we know (we exchange only the AGGREGATE).
federation:
  peers:
    - { id: ikea, name: "IKEA Bologna", url: "http://127.0.0.1:8002" }
